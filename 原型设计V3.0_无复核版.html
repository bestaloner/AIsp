<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI辅助巡检预处理中台 V3 · Deep Space Glass</title>
<style>
/* ====== V3 Design System: Deep Space Glass ====== */
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root {
  /* Space palette */
  --space-deep: #060B14;
  --space-mid: #0B1221;
  --space-light: #111B2E;
  --space-card: rgba(15, 23, 42, 0.65);
  --space-card-hover: rgba(15, 23, 42, 0.82);
  --space-sidebar: rgba(8, 12, 24, 0.85);

  /* Accent */
  --primary: #3B82F6;
  --primary-glow: rgba(59, 130, 246, 0.3);
  --primary-light: #60A5FA;
  --cyan: #06B6D4;
  --cyan-glow: rgba(6, 182, 212, 0.3);

  /* Functional */
  --success: #22C55E;
  --success-glow: rgba(34, 197, 94, 0.3);
  --danger: #EF4444;
  --danger-glow: rgba(239, 68, 68, 0.3);
  --warning: #F59E0B;
  --warning-glow: rgba(245, 158, 11, 0.3);
  --purple: #8B5CF6;
  --orange: #F97316;

  /* Text */
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --text-accent: #E2E8F0;

  /* Glass */
  --glass-bg: rgba(15, 23, 42, 0.55);
  --glass-border: rgba(148, 163, 184, 0.12);
  --glass-border-hover: rgba(148, 163, 184, 0.22);
  --glass-blur: 16px;
  --glass-highlight: rgba(255, 255, 255, 0.04);

  /* Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-pill: 9999px;

  /* Shadows */
  --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.25);
  --shadow-hover: 0 2px 4px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.35);
  --shadow-glass: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.06);
  --shadow-glow: 0 0 20px var(--primary-glow);

  /* Layout */
  --sidebar-w: 230px;
  --topbar-h: 52px;

  /* Scene colors - toned for dark bg */
  --c1: #F87171; --c2: #FB923C; --c3: #FACC15; --c4: #4ADE80;
  --c5: #60A5FA; --c6: #A78BFA; --c7: #F87171; --c8: #FBBF24;
  --c9: #34D399; --c10: #818CF8; --c11: #9CA3AF; --c12: #6B7280;

  /* Transitions */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 150ms var(--ease);
  --transition-normal: 250ms var(--ease);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-primary);
  background: var(--space-deep);
  line-height: 1.6;
  overflow: hidden;
  color-scheme: dark;  /* 强制浏览器暗色表单控件 */
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Background ambient */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ====== LOGIN ====== */
.login-pg {
  display: flex;
  height: 100vh;
  position: relative;
  isolation: isolate;
}
.login-pg .bg-deco {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.login-pg .bg-deco::before {
  content: '';
  position: absolute;
  width: 700px; height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(6, 182, 212, 0.06) 40%, transparent 70%);
  top: -120px; left: -120px;
  animation: orbFloat 8s ease-in-out infinite;
}
.login-pg .bg-deco::after {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
  bottom: -80px; right: -80px;
  animation: orbFloat 10s ease-in-out infinite reverse;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.05); }
  66% { transform: translate(-20px, 20px) scale(0.95); }
}
.login-pg .bg-deco h1 {
  font-size: 34px;
  font-weight: 700;
  color: var(--text-primary);
  position: relative;
  z-index: 1;
  text-align: center;
  letter-spacing: -0.5px;
  text-shadow: 0 0 40px var(--primary-glow);
}
.login-pg .bg-deco p {
  color: var(--text-secondary);
  margin-top: 10px;
  text-align: center;
  font-size: 14px;
  font-weight: 300;
  position: relative;
  z-index: 1;
}

.login-card-wrap {
  width: 440px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.login-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  padding: 44px 40px;
  width: 370px;
  box-shadow: var(--shadow-glass);
}
.login-card h2 {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 28px;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}
.login-card .fg { margin-bottom: 16px; }
.login-card .fg label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.login-card .fg input,
.login-card .fg select {
  width: 100%;
  height: 44px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 0 14px;
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition-fast);
  font-family: inherit;
}
.login-card .fg input::placeholder { color: var(--text-muted); }
.login-card .fg input:focus,
.login-card .fg select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
  background: rgba(255, 255, 255, 0.08);
}
.login-card .fg select { cursor: pointer; }
.login-card .fg select option { background: var(--space-mid); color: var(--text-primary); }

.login-card .login-btn {
  width: 100%;
  height: 46px;
  background: linear-gradient(135deg, var(--primary), #2563EB);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: all var(--transition-fast);
  letter-spacing: 0.3px;
  position: relative;
  overflow: hidden;
}
.login-card .login-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition: left 0.5s;
}
.login-card .login-btn:hover {
  box-shadow: var(--shadow-glow);
  transform: translateY(-1px);
}
.login-card .login-btn:hover::before { left: 100%; }
.login-card .hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 16px;
  line-height: 1.6;
}

/* ====== APP SHELL ====== */
.app { display: none; height: 100vh; position: relative; z-index: 1; }
.app.show { display: flex; }

.sidebar {
  width: var(--sidebar-w);
  background: var(--space-sidebar);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-logo {
  padding: 16px 20px;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}
.sidebar-logo .logo-icon {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--primary), var(--cyan));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 0 12px var(--primary-glow);
}

.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-group { margin: 1px 0; }
.nav-group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 12px;
  font-weight: 600;
  user-select: none;
  letter-spacing: 0.4px;
}
.nav-group-title:hover {
  color: var(--text-accent);
  background: rgba(255,255,255,0.03);
}
.nav-group-title .ng-arrow {
  font-size: 8px;
  transition: transform var(--transition-fast);
  width: 12px;
  text-align: center;
  opacity: 0.5;
}
.nav-group.open > .nav-group-title .ng-arrow {
  transform: rotate(90deg);
  opacity: 0.9;
}
.nav-group-title .ng-icon {
  width: 18px;
  text-align: center;
  font-size: 14px;
}

.nav-group-items {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s var(--ease);
}
.nav-group.open > .nav-group-items { max-height: 220px; }

.nav-sub-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px 9px 38px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 12px;
  font-weight: 400;
  border-left: 3px solid transparent;
}
.nav-sub-item:hover {
  color: var(--text-primary);
  background: rgba(255,255,255,0.04);
}
.nav-sub-item.active {
  color: var(--primary-light);
  background: rgba(59, 130, 246, 0.1);
  border-left-color: var(--primary);
  font-weight: 500;
  box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
}
.nav-sub-item.core { color: var(--warning); }
.nav-sub-item.core.active {
  border-left-color: var(--warning);
  background: rgba(245, 158, 11, 0.1);
}

.sidebar-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--glass-border);
  font-size: 10px;
  color: var(--text-muted);
}

/* ====== MAIN AREA ====== */
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.topbar .breadcrumb { font-size: 12px; color: var(--text-secondary); }
.topbar .breadcrumb span { color: var(--text-primary); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-right .notif {
  position: relative;
  cursor: pointer;
  font-size: 17px;
  color: var(--text-secondary);
  transition: color var(--transition-fast);
}
.topbar-right .notif:hover { color: var(--text-primary); }
.topbar-right .notif .dot {
  position: absolute;
  top: -3px; right: -3px;
  width: 8px; height: 8px;
  background: var(--danger);
  border-radius: 50%;
  border: 2px solid var(--space-deep);
  box-shadow: 0 0 8px var(--danger-glow);
}
.topbar-right .user {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-primary);
}
/* Cascade geo filter */
.topbar-geo { display: flex; align-items: center; gap: 6px; }
.topbar-geo select {
  padding: 4px 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text-primary);
  outline: none;
  cursor: pointer;
  font-family: inherit;
  max-width: 100px;
  transition: all var(--transition-fast);
}
.topbar-geo select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.topbar-geo select option { background: var(--space-mid); color: var(--text-primary); }
.topbar-geo .geo-clear {
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  transition: all var(--transition-fast);
}
.topbar-geo .geo-clear:hover { color: var(--danger); border-color: var(--glass-border); }
.topbar-geo .geo-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }

/* Camera scene config modal */
.scene-config-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.scene-config-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 12px;
}
.scene-config-item:hover { background: rgba(255,255,255,0.06); border-color: var(--glass-border-hover); }
.scene-config-item input[type="checkbox"] { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }

/* Pagination for project/camera lists */
.pagination { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }

.topbar-right .avatar {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--primary), var(--cyan));
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 0 10px var(--primary-glow);
}

.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  background: transparent;
}
.page { display: none; animation: fadeIn 0.25s var(--ease); }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ====== SHARED COMPONENTS ====== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition-fast);
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #2563EB);
  color: #fff;
  border-color: rgba(59, 130, 246, 0.3);
}
.btn-primary:hover { box-shadow: 0 0 16px var(--primary-glow); transform: translateY(-1px); }

.btn-outline {
  background: transparent;
  color: var(--text-accent);
  border: 1px solid var(--glass-border);
}
.btn-outline:hover { background: rgba(255,255,255,0.05); border-color: var(--glass-border-hover); }

.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { box-shadow: 0 0 14px var(--success-glow); }

.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { box-shadow: 0 0 14px var(--danger-glow); }

.btn-warning { background: var(--orange); color: #fff; }
.btn-warning:hover { box-shadow: 0 0 14px var(--warning-glow); }

.btn-info { background: var(--primary); color: #fff; }
.btn-info:hover { box-shadow: 0 0 14px var(--primary-glow); }

.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-lg { padding: 10px 22px; font-size: 15px; }
.btn-xs { padding: 3px 8px; font-size: 11px; }

/* Stats cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.stats-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.stat-card {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all var(--transition-normal);
}
.stat-card:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--shadow-glass);
  transform: translateY(-2px);
}
.stat-card .sc-val {
  font-size: 30px;
  font-weight: 700;
  color: var(--text-primary);
  font-family: 'Fira Code', monospace;
  letter-spacing: -1px;
}
.stat-card .sc-lbl {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Cards */
.card {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 16px;
  transition: border-color var(--transition-normal);
}
.card:hover { border-color: var(--glass-border-hover); }
.card-hd {
  padding: 14px 20px;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
}
.card-bd { padding: 20px; }

/* Tags & Badges */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 500;
  gap: 3px;
}
.tag-s { background: rgba(34, 197, 94, 0.15); color: #4ADE80; border: 1px solid rgba(34, 197, 94, 0.2); }
.tag-d { background: rgba(239, 68, 68, 0.15); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.2); }
.tag-w { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.2); }
.tag-i { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.2); }
.tag-g { background: rgba(100, 116, 139, 0.15); color: #94A3B8; border: 1px solid rgba(100, 116, 139, 0.2); }
.tag-o { background: rgba(249, 115, 22, 0.15); color: #FB923C; border: 1px solid rgba(249, 115, 22, 0.2); }
.tag-p { background: rgba(139, 92, 246, 0.15); color: #A78BFA; border: 1px solid rgba(139, 92, 246, 0.2); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 10px;
  font-weight: 600;
}
.badge-yolo { background: rgba(100, 116, 139, 0.2); color: #94A3B8; }
.badge-vlm { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }
.badge-human { background: rgba(249, 115, 22, 0.2); color: #FB923C; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: rgba(255, 255, 255, 0.03); }
th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--glass-border);
}
td {
  padding: 11px 16px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.06);
  color: var(--text-primary);
}
tr:hover td { background: rgba(59, 130, 246, 0.04); }
tr.row-sel td { background: rgba(59, 130, 246, 0.12) !important; }
/* Pagination */
.pagination { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
.pagination button { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; transition: all var(--transition-fast); }
.pagination button:hover { background: rgba(255,255,255,0.1); }
.pagination button:disabled { opacity: 0.3; cursor: default; }
.pagination select { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius-sm); font-size: 11px; outline: none; }
.pagination .pg-info { color: var(--text-muted); font-size: 11px; }
.round-row { cursor: pointer; transition: all var(--transition-fast); }
.round-row:hover td { background: rgba(59,130,246,0.08); }
.round-row.sel td { background: rgba(59,130,246,0.15) !important; border-left: 3px solid var(--primary); }

/* Filters */
.filters {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.filters input,
.filters select {
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition-fast);
  font-family: inherit;
}
.filters input::placeholder { color: var(--text-muted); }
.filters input:focus,
.filters select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.filters select { cursor: pointer; }
.filters select option { background: var(--space-mid); color: var(--text-primary); }

/* Modals */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--space-light);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  width: 560px;
  max-width: 92vw;
  max-height: 82vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  padding: 28px 32px;
}
.modal h3 {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--text-primary);
}
.modal-hd {
  padding: 16px 24px;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  color: var(--text-primary);
}
.modal-hd .mclose {
  cursor: pointer;
  font-size: 20px;
  color: var(--text-secondary);
  background: none;
  border: none;
  transition: color var(--transition-fast);
}
.modal-hd .mclose:hover { color: var(--text-primary); }
.modal-bd { padding: 24px; }
.modal-ft {
  padding: 14px 24px;
  border-top: 1px solid var(--glass-border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Toast */
.toast-ctn {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 12px 18px;
  border-radius: var(--radius-md);
  color: #fff;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: toastIn 0.3s var(--ease);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.toast-s { background: rgba(34, 197, 94, 0.85); }
.toast-e { background: rgba(239, 68, 68, 0.85); }
.toast-i { background: rgba(59, 130, 246, 0.85); }
.toast-w { background: rgba(249, 115, 22, 0.85); }

/* Form fields */
.fg { margin-bottom: 14px; }
.fg label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.fg input,
.fg select {
  width: 100%;
  height: 40px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition-fast);
  font-family: inherit;
}
.fg input:focus,
.fg select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.fg select { cursor: pointer; }
.fg select option { background: var(--space-mid); color: var(--text-primary); }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text-primary);
  resize: vertical;
  min-height: 70px;
  font-family: inherit;
  outline: none;
  transition: all var(--transition-fast);
}
.form-textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}

.day-card:hover {
  border-color: var(--primary) !important;
  box-shadow: 0 0 16px var(--primary-glow);
  transform: translateY(-2px);
  background: var(--space-card-hover) !important;
}

/* ====== MATRIX TABLE ====== */
.cs-matrix { overflow-x: auto; font-size: 12px; }
.cs-matrix th, .cs-matrix td {
  padding: 7px 10px;
  text-align: center;
  border: 1px solid var(--glass-border);
}
.cs-matrix th { background: rgba(255, 255, 255, 0.03); font-weight: 600; font-size: 11px; }
.cs-matrix td:first-child { text-align: left; font-weight: 500; background: rgba(255,255,255,0.02); }
.cs-matrix input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
.cs-legend { display: flex; gap: 14px; font-size: 11px; margin-bottom: 10px; flex-wrap: wrap; }
.cs-legend span { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); }
.cs-dot { width: 10px; height: 10px; border-radius: 2px; }

/* ====== PERMISSION MATRIX ====== */
.perm-matrix th:first-child, .perm-matrix td:first-child { text-align: left; font-weight: 500; }
.perm-check { color: var(--success); }
.perm-cross { color: var(--danger); }
.perm-partial { color: var(--warning); }

/* ====== SCROLLBARS ====== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.35); }

/* ====== PAGE-SPECIFIC STYLES ====== */
/* Login page background */
.login-pg { background: var(--space-deep); }

/* Links in cards */
.card-hd a { color: var(--primary-light); text-decoration: none; transition: color var(--transition-fast); }
.card-hd a:hover { color: var(--cyan); }
</style>
</head>

<script>
// ====== STATE ======
const S = {
  user: null,
  page: 'dashboard',
  taskRoundIdx: null, taskPage: 0, tasksPerPage: 50,
  roundPage: 0, roundsPerPage: 3,
                            projects: [],
  cameras: [],
  rounds: [],
  tasks: [],
  users: [],
  userIdCounter: 0,
  logs: [],
	_taskSearch: '', _taskStatusFilter: '',
    _reportTab: 'round', _reportRoundId: null, _reportDay: null,
  _taskSelectedDay: null, _taskDayPage: 0, _taskDayPerPage: 10,
  _projSearch: '', _projStatus: '', _projPage: 0,
  _camSearch: '', _camStatus: '', _camPage: 0,
  // 模块地理筛选
  _projCityFilter: '', _projDistrictFilter: '',
  _camCityFilter: '', _camDistrictFilter: ''
};

// ====== MOCK DATA ======
const SCENES = [
  {id:1,name:'安全帽佩戴',color:'#F87171',type:'目标检测'},
  {id:2,name:'安全绳佩戴',color:'#FB923C',type:'目标检测'},
  {id:3,name:'临边防护缺失',color:'#FACC15',type:'场景理解'},
  {id:4,name:'电梯搭载人数',color:'#4ADE80',type:'目标检测+计数'},
  {id:5,name:'工人私自开机',color:'#60A5FA',type:'行为检测'},
  {id:6,name:'坑边堆载',color:'#A78BFA',type:'场景理解'},
  {id:7,name:'违规抽烟',color:'#F87171',type:'目标检测'},
  {id:8,name:'散料吊装',color:'#FBBF24',type:'场景理解'},
  {id:9,name:'吊篮作业人数',color:'#34D399',type:'目标检测+计数'},
  {id:10,name:'起重机械安拆人数',color:'#818CF8',type:'目标检测+计数'},
  {id:11,name:'出入口防护棚',color:'#9CA3AF',type:'存在性检测'},
  {id:12,name:'工地围挡封闭',color:'#6B7280',type:'场景理解'},
];

// ====== 福建省市县层级数据 ======
const FUJIAN_CITIES = [
  {city:'福州市', districts:['鼓楼区','台江区','仓山区','马尾区','晋安区','长乐区','闽侯县','连江县','罗源县','闽清县','永泰县','平潭县','福清市']},
  {city:'厦门市', districts:['思明区','海沧区','湖里区','集美区','同安区','翔安区']},
  {city:'泉州市', districts:['鲤城区','丰泽区','洛江区','泉港区','惠安县','安溪县','永春县','德化县','石狮市','晋江市','南安市']},
  {city:'漳州市', districts:['芗城区','龙文区','云霄县','漳浦县','诏安县','长泰县','东山县','南靖县','平和县','华安县','龙海市']},
  {city:'龙岩市', districts:['新罗区','永定区','长汀县','上杭县','武平县','连城县','漳平市']},
  {city:'三明市', districts:['梅列区','三元区','明溪县','清流县','宁化县','大田县','尤溪县','沙县','将乐县','泰宁县','建宁县','永安市']},
  {city:'南平市', districts:['延平区','建阳区','顺昌县','浦城县','光泽县','松溪县','政和县','邵武市','武夷山市','建瓯市']},
  {city:'莆田市', districts:['城厢区','涵江区','荔城区','秀屿区','仙游县']},
  {city:'宁德市', districts:['蕉城区','霞浦县','古田县','屏南县','寿宁县','周宁县','柘荣县','福安市','福鼎市']}
];

function initMockData() {
  // 生成60个样本项目，覆盖福建9市，每项目2-6路摄像头
  const projPrefixes = ['建发','融信','保利','万科','华润','龙湖','旭辉','正荣','三盛','世茂','阳光城','泰禾','中骏','联发','国贸'];
  const projSuffixes = ['悦府','壹号府','中央公园','天汇','金域蓝湾','万象城','春江天玺','江山境','御景台','观澜府','锦绣里','翡翠湾','雍景湾','云栖谷','桃源里'];
  const camPrefixes = ['塔吊A','围挡B','临边C','主入口','基坑D','楼顶E','加工区F','通道G'];
  const statuses = ['active','active','active','active','active','active','active','suspended','suspended'];

  // 扁平化市-区县列表用于随机分配
  let allDistricts = [];
  FUJIAN_CITIES.forEach(c => { c.districts.forEach(d => { allDistricts.push({city:c.city, district:d}); }); });

  S.projects = [];
  S.cameras = [];
  let cid = 0;

  for(let i=0;i<60;i++) {
    let geo = allDistricts[Math.floor(Math.random()*allDistricts.length)];
    let prefix = projPrefixes[Math.floor(Math.random()*projPrefixes.length)];
    let suffix = projSuffixes[Math.floor(Math.random()*projSuffixes.length)];
    let p = {id:i+1, name:prefix+suffix+(i>0&&Math.random()>0.7?'#'+Math.floor(Math.random()*10):''), city:geo.city, district:geo.district, status:statuses[Math.floor(Math.random()*statuses.length)], cameras:[], lastInspect:fmtDate(new Date(2026,4,28-Math.floor(Math.random()*30)))};
    let nc = 2 + Math.floor(Math.random()*5);
    for(let j=0;j<nc;j++) {
      cid++;
      let cam = {id:cid, puid:'20111520342432'+String(7567+cid), name:camPrefixes[j%8]+(j>=8?String(Math.floor(j/8)):''), projectId:p.id, projectName:p.name, city:geo.city, district:geo.district, status:Math.random()>0.15?'online':'offline', scenes:[], lastCapture:Math.random()>0.15?fmtDate(new Date(2026,4,28))+' 0'+Math.floor(Math.random()*8+1)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'):null};
      SCENES.forEach(s=>{ if(Math.random()>0.3) cam.scenes.push(s.id); });
      S.cameras.push(cam);
      p.cameras.push(cam.id);
    }
    S.projects.push(p);
  }

  // -- 轮次数据（一个轮次 = 一轮完整 5000 项目覆盖）--
  S.rounds = [];
  let roundCycleDays = 10;
  for(let r=0;r<3;r++) {
    let roundNum = 8-r;  // 第8轮(当前)、第7轮、第6轮
    let endDate = new Date(2026,4,28-r*roundCycleDays);
    let startDate = new Date(endDate.getTime()-(roundCycleDays-1)*86400000);
    let totalProjects = 5000;
    let totalCameras = 13000;
    let dailyTarget = 2600;  // 日均图片识别任务约2,600张（13,000路轮转调度，约20%激活）
    let totalTarget = dailyTarget * roundCycleDays;  // 整轮目标 = 2,600×10天 = 26,000 张

    let completed = r>0;
    let progressDays = completed ? roundCycleDays : 6;  // 当前轮次已执行6天
    let dailyEntries = [];
    for(let d=1;d<=roundCycleDays;d++) {
      let dayDate = new Date(startDate.getTime()+(d-1)*86400000);
      if(d<=progressDays) {
        let amCap = Math.floor(dailyTarget*0.48+Math.random()*dailyTarget*0.04);  // AM 约1,248~1,352张
        let pmCap = Math.floor(dailyTarget*0.47+Math.random()*dailyTarget*0.04);  // PM 约1,222~1,326张
        let amInf = Math.floor(amCap*(0.94+Math.random()*0.05));  // 推理覆盖率 94%~99%
        let pmInf = Math.floor(pmCap*(0.94+Math.random()*0.05));
        let amRev = Math.floor(amInf*(0.60+Math.random()*0.15));  // AI识别完成率 60%~75%
        let pmRev = Math.floor(pmInf*(0.60+Math.random()*0.15));
        dailyEntries.push({day:d, date:fmtDate(dayDate),
          am:{captured:amCap, inferred:amInf, reviewed:amRev, excluded:Math.floor(amRev*(0.08+Math.random()*0.05))},
          pm:{captured:pmCap, inferred:pmInf, reviewed:pmRev, excluded:Math.floor(pmRev*(0.06+Math.random()*0.04))}
        });
      } else {
        dailyEntries.push({day:d, date:fmtDate(dayDate),
          am:{captured:0, inferred:0, reviewed:0, excluded:0},
          pm:{captured:0, inferred:0, reviewed:0, excluded:0}
        });
      }
    }

    let agg = dailyEntries.reduce((a,d)=>({
      captured:a.captured+d.am.captured+d.pm.captured,
      inferred:a.inferred+d.am.inferred+d.pm.inferred,
      reviewed:a.reviewed+d.am.reviewed+d.pm.reviewed,
      excluded:a.excluded+d.am.excluded+d.pm.excluded,
      // 单日失败 = 日目标 - 实际(AM+PM)
      failed:a.failed+(d.am.captured?Math.max(0,dailyTarget-d.am.captured-d.pm.captured):0)
    }),{captured:0,inferred:0,reviewed:0,excluded:0,failed:0});

    // 项目覆盖：日覆盖约500项目(2,600张÷5张/项目)，6天累计约60%~72%
    let prCov = completed ? totalProjects : Math.floor(totalProjects*(0.60+Math.random()*0.12));
    // 已激活摄像头：日激活约2,600路(20%轮转)，6天累计去重约65%~75%
    let camCap = completed ? totalCameras : Math.floor(totalCameras*(0.65+Math.random()*0.10));

    S.rounds.push({
      id:'R-'+String(2026000+roundNum),
      name:'第'+roundNum+'轮巡检',
      cycleDays:roundCycleDays,
      dateRange:{start:fmtDate(startDate),end:fmtDate(endDate)},
      totalProjects,totalCameras,totalTarget,
      dailyTarget: dailyTarget,  // 日均抓拍目标2,600张
      status:completed?'completed':'running',
      createdBy:'system',
      createdAt:fmtDate(startDate)+' 05:00:00',
      startedAt:fmtDate(startDate)+' 06:00:12',
      completedAt:completed?fmtDate(endDate)+' 17:45:00':null,
      dailyProgress:dailyEntries,
      stats:{projectsCovered:prCov, camerasCaptured:camCap,
        totalCaptures:agg.captured, inferred:agg.inferred,
        pendingReview:agg.inferred-agg.reviewed-agg.excluded,
        completedReview:agg.reviewed, excluded:agg.excluded, failed:agg.failed}
    });
  }

  S.rounds.sort((a,b)=>b.dateRange.start.localeCompare(a.dateRange.start));
	let currentRound = S.rounds[0];

  // -- 任务数据关联到轮次 --
  S.tasks = [];
  let taskDp = currentRound.dailyProgress.filter(d=>d.am.captured>0||d.pm.captured>0);
  for(let i=0;i<200;i++) {
    let p = S.projects[Math.floor(Math.random()*S.projects.length)];
    let c = S.cameras.filter(c=>c.projectId===p.id)[0] || S.cameras[0];
    let hasDanger = Math.random()>0.4;
    let nDanger = hasDanger ? Math.floor(Math.random()*5)+1 : 0;
    let status = Math.random()>0.5?'ai_completed':'inferring';
    let dp = taskDp[Math.floor(Math.random()*taskDp.length)]||taskDp[0];
    S.tasks.push({id:i+1, projectId:p.id, projectName:p.name, cameraId:c.id, cameraName:c.name, puid:c.puid,
      roundId:currentRound.id, roundDay:dp.day, roundAmpm:Math.random()>0.5?'AM':'PM',
      status, dangerCount:nDanger, detections:[], reviewHistory:[],

// ====== 模块地理筛选辅助函数 ======
function getFilteredProjects() {
  let projects = S.projects;
  if(S._projCityFilter) projects = projects.filter(p=>p.city===S._projCityFilter);
  if(S._projDistrictFilter) projects = projects.filter(p=>p.district===S._projDistrictFilter);
  return projects;
}
function getFilteredCameras() {
  let cameras = S.cameras;
  if(S._camCityFilter) cameras = cameras.filter(c=>c.city===S._camCityFilter);
  if(S._camDistrictFilter) cameras = cameras.filter(c=>c.district===S._camDistrictFilter);
  return cameras;
}
function getDistrictsForCity(cityName) {
  let city = FUJIAN_CITIES.find(c=>c.city===cityName);
  return city ? city.districts : [];
}
// 级联筛选渲染（模块内嵌使用）
function renderCascadeFilter(prefix) {
  let h = '';
  let cityKey = '_'+prefix+'CityFilter', districtKey = '_'+prefix+'DistrictFilter';
  h += '<select onchange="S.'+cityKey+'=this.value;S.'+districtKey+'=\'\';S.'+prefix+'Page=0;renderPage(S.page)"><option value="">全省</option>';
  FUJIAN_CITIES.forEach(c => {
    h += '<option value="'+c.city+'"'+(S[cityKey]===c.city?' selected':'')+'>'+c.city+'</option>';
  });
  h += '</select>';
  h += '<select onchange="S.'+districtKey+'=this.value;S.'+prefix+'Page=0;renderPage(S.page)"><option value="">全部区县</option>';
  if(S[cityKey]) {
    getDistrictsForCity(S[cityKey]).forEach(d => {
      h += '<option value="'+d+'"'+(S[districtKey]===d?' selected':'')+'>'+d+'</option>';
    });
  }
  h += '</select>';
  if(S[cityKey]||S[districtKey]) {
    h += '<button class="geo-clear" onclick="S.'+cityKey+'=\'\';S.'+districtKey+'=\'\';S.'+prefix+'Page=0;renderPage(S.page)" title="清除筛选">✕</button>';
  }
  return h;
}

function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ====== MODAL ======
function showModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
document.addEventListener('click', function(e) {
  if(e.target.id==='modalOverlay') closeModal();
});

// ====== NAVIGATION ======
function navTo(page) {
  S.page = page;
  document.querySelectorAll('.nav-sub-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  let activeItem = document.querySelector(`.nav-sub-item[data-page="${page}"]`);
  if(activeItem) {
    let group = activeItem.closest('.nav-group');
    if(group && !group.classList.contains('open')) {
      group.classList.add('open');
    }
  }
  const titles = {dashboard:'工作台总览',tasks:'任务管理',rounds:'轮次管理',reports:'巡检报告',projects:'项目管理',cameras:'摄像头配置',users:'用户管理',model:'模型参数',perm:'权限矩阵',logs:'操作日志'};
  document.getElementById('pageTitle').textContent = titles[page]||page;
  renderPage(page);
}

function toggleNavGroup(titleEl) {
  titleEl.parentElement.classList.toggle('open');
}

function renderPage(page) {
  const pc = document.getElementById('pageContent');
  switch(page) {
    case 'dashboard': pc.innerHTML = renderDashboard(); break;
        case 'tasks': pc.innerHTML = renderTasks(); break;
    case 'rounds': pc.innerHTML = renderRounds(); break;
    case 'reports': pc.innerHTML = renderReports(); break;
    case 'projects': pc.innerHTML = renderProjects(); break;
    case 'cameras': pc.innerHTML = renderCameras(); break;
    case 'users': pc.innerHTML = renderUsers(); break;
    case 'model': pc.innerHTML = renderModel(); break;
    case 'perm': pc.innerHTML = renderPerm(); break;
    case 'logs': pc.innerHTML = renderLogs(); break;
  }
}

function renderDailyReport() {
  let selRound = S.rounds.find(r=>r.id===(S._reportRoundId||S.rounds[0].id)) || S.rounds[0];
  if(!S._reportRoundId) S._reportRoundId = selRound.id;
  let activeDays = selRound.dailyProgress.filter(d=>d.am.captured>0||d.pm.captured>0);
  let selDayIdx = S._reportDay!=null?S._reportDay:activeDays.length-1;
  let selDay = selRound.dailyProgress[selDayIdx];
  if(!selDay) selDay = activeDays[activeDays.length-1];
  let dailyTotal = (selDay.am.captured||0)+(selDay.pm.captured||0);
  let dailyInf = (selDay.am.inferred||0)+(selDay.pm.inferred||0);
  let dailyRev = (selDay.am.reviewed||0)+(selDay.pm.reviewed||0);
  let dailyExc = (selDay.am.excluded||0)+(selDay.pm.excluded||0);

  return `
<div class="card"><div class="card-hd" style="justify-content:flex-start;gap:16px;flex-wrap:wrap">
  <span style="font-weight:600">选择轮次</span>
  <select onchange="S._reportRoundId=this.value;S._reportDay=null;renderPage('reports')" style="padding:6px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;outline:none;color:var(--text-primary);font-family:inherit">
    ${S.rounds.map(r=>`<option value="${r.id}" ${r.id===selRound.id?'selected':''}>${r.name} (${r.dateRange.start}~${r.dateRange.end})</option>`).join('')}
  </select>
  <span style="font-weight:600;margin-left:8px">选择日期</span>
  <select onchange="S._reportDay=parseInt(this.value);renderPage('reports')" style="padding:6px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;outline:none;color:var(--text-primary);font-family:inherit">
    ${selRound.dailyProgress.map((d,i)=>`<option value="${i}" ${i===selDayIdx?'selected':''}>Day ${d.day} · ${d.date} ${d.am.captured>0||d.pm.captured>0?'':'（未执行）'}</option>`).join('')}
  </select>
</div></div>

<div class="stats-grid">
<div class="stat-card"><div class="sc-val">${dailyTotal.toLocaleString()}</div><div class="sc-lbl">当日抓拍 (AM+PM)</div></div>
<div class="stat-card"><div class="sc-val" style="color:var(--cyan)">${dailyInf.toLocaleString()}</div><div class="sc-lbl">当日AI推理完成</div></div>
<div class="stat-card"><div class="sc-val" style="color:var(--success)">${dailyRev.toLocaleString()}</div><div class="sc-lbl">当日AI标记隐患</div></div>
<div class="stat-card"><div class="sc-val" style="color:var(--text-secondary)">${(dailyInf-dailyRev-dailyExc).toLocaleString()}</div><div class="sc-lbl">推理中待识别</div></div>
</div>

<div style="display:flex;gap:16px;margin-bottom:16px">
<div class="card" style="flex:1"><div class="card-hd">Day ${selDay.day} · ${selDay.date} — AM 批次</div><div class="card-bd">
<table><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody>
<tr><td>抓拍</td><td style="font-weight:600">${selDay.am.captured>0?selDay.am.captured.toLocaleString():'—'}</td></tr>
<tr><td>AI推理</td><td>${selDay.am.inferred>0?selDay.am.inferred.toLocaleString():'—'}</td></tr>
<tr><td>AI识别完成</td><td style="color:var(--success)">${selDay.am.reviewed>0?selDay.am.reviewed.toLocaleString():'—'}</td></tr>
</tbody></table></div></div>
<div class="card" style="flex:1"><div class="card-hd">PM 批次</div><div class="card-bd">
<table><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody>
<tr><td>抓拍</td><td style="font-weight:600">${selDay.pm.captured>0?selDay.pm.captured.toLocaleString():'—'}</td></tr>
<tr><td>AI推理</td><td>${selDay.pm.inferred>0?selDay.pm.inferred.toLocaleString():'—'}</td></tr>
<tr><td>AI识别完成</td><td style="color:var(--success)">${selDay.pm.reviewed>0?selDay.pm.reviewed.toLocaleString():'—'}</td></tr>
</tbody></table></div></div>
</div>

<div class="card"><div class="card-hd">${selRound.name} · Day ${selDay.day} — 当日汇总报告</div><div class="card-bd">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div>
  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">基本信息</div>
  <table><tbody>
    <tr><td style="color:var(--text-secondary)">轮次</td><td>${selRound.name}</td></tr>
    <tr><td style="color:var(--text-secondary)">日期</td><td>${selDay.date}</td></tr>
    <tr><td style="color:var(--text-secondary)">巡检天数</td><td>Day ${selDay.day} / ${selRound.cycleDays}</td></tr>
    <tr><td style="color:var(--text-secondary)">当日抓拍总量</td><td style="font-weight:600">${dailyTotal.toLocaleString()} 张</td></tr>
    <tr><td style="color:var(--text-secondary)">当日抓拍成功率</td><td>${(selRound.dailyTarget||2600)>0?Math.round(dailyTotal/(selRound.dailyTarget||2600)*100):0}%</td></tr>
  </tbody></table>
</div>
<div>
  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">AI识别统计</div>
  <table><tbody>
    <tr><td style="color:var(--text-secondary)">AI标记隐患</td><td style="color:var(--success);font-weight:600">${dailyRev.toLocaleString()}</td></tr>

    <tr><td style="color:var(--text-secondary)">推理中待识别</td><td style="color:var(--warning)">${(dailyInf-dailyRev-dailyExc).toLocaleString()}</td></tr>
    <tr><td style="color:var(--text-secondary)">AI覆盖率</td><td>${(dailyRev+dailyExc)>0?Math.round(dailyRev/(dailyRev+dailyExc)*100):0}%</td></tr>
  </tbody></table>
</div>
</div>
</div></div>

<div style="display:flex;gap:8px;margin-top:16px">
<button class="btn btn-primary" onclick="toast('日报告PDF已生成','s')">📥 导出日报告PDF</button>
<button class="btn btn-outline" onclick="toast('日报告Excel已生成','s')">📊 导出日报告Excel</button>
</div>`;
}

function renderMonthlyReport() {
  // Group rounds by month
  let monthMap = {};
  S.rounds.forEach(r=>{
    let m = r.dateRange.start.substring(0,7); // "2026-05"
    if(!monthMap[m]) monthMap[m] = {label:m+'年'+(parseInt(m.split('-')[1]))+'月', rounds:[]};
    monthMap[m].rounds.push(r);
  });
  let months = Object.values(monthMap);
  let selMonth = S._reportRoundId || (months.length>0?Object.keys(monthMap)[0]:'2026-05');
  let monthData = monthMap[selMonth];
  if(!monthData) monthData = months[0];
  if(!monthData) return '<div class="card"><div class="card-bd" style="text-align:center;color:var(--text-muted);padding:40px">暂无月度数据</div></div>';

  // Aggregate stats across rounds in this month
  let agg = monthData.rounds.reduce((a,r)=>({
    projectsCovered: Math.max(a.projectsCovered, r.stats.projectsCovered),
    totalCaptures: a.totalCaptures + r.stats.totalCaptures,
    inferred: a.inferred + r.stats.inferred,
    completedReview: a.completedReview + r.stats.completedReview,
    excluded: a.excluded + r.stats.excluded,
    failed: a.failed + r.stats.failed,
    pendingReview: a.pendingReview + r.stats.pendingReview
  }),{projectsCovered:0,totalCaptures:0,inferred:0,completedReview:0,excluded:0,failed:0,pendingReview:0});

  let aiAcc = (agg.completedReview+agg.excluded)>0?Math.round(agg.completedReview/(agg.completedReview+agg.excluded)*100):0;

  return `
<div class="card"><div class="card-hd" style="justify-content:flex-start;gap:16px">
  <span style="font-weight:600">选择月份</span>
  <select onchange="S._reportRoundId=this.value;renderPage('reports')" style="padding:6px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;outline:none;color:var(--text-primary);font-family:inherit;min-width:200px">
    ${months.map(m=>`<option value="${m.rounds[0].dateRange.start.substring(0,7)}" ${m.rounds[0].dateRange.start.substring(0,7)===selMonth?'selected':''}>${m.label} (${m.rounds.length}个轮次)</option>`).join('')}
  </select>
  <span style="font-size:11px;color:var(--text-secondary)">汇总 ${monthData.rounds.length} 个轮次 · ${monthData.rounds.map(r=>r.name).join('、')}</span>
</div></div>

<div class="stats-grid">
<div class="stat-card"><div class="sc-val">${agg.projectsCovered.toLocaleString()}</div><div class="sc-lbl">覆盖项目（当月最大值）</div></div>
<div class="stat-card"><div class="sc-val" style="color:var(--danger)">${agg.completedReview.toLocaleString()}</div><div class="sc-lbl">AI标记隐患（当月合计）</div></div>
<div class="stat-card"><div class="sc-val" style="color:var(--success)">${aiAcc}%</div><div class="sc-lbl">AI识别覆盖率</div></div>
<div class="stat-card"><div class="sc-val">${agg.totalCaptures.toLocaleString()}</div><div class="sc-lbl">累计抓拍（当月合计）</div></div>
</div>

<div class="card" style="margin-bottom:16px"><div class="card-hd">${monthData.label} — 月度数据汇总</div><div class="card-bd">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div>
  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">总体统计</div>
  <table><tbody>
    <tr><td style="color:var(--text-secondary)">包含轮次</td><td>${monthData.rounds.length} 个 (${monthData.rounds.map(r=>r.name).join(', ')})</td></tr>
    <tr><td style="color:var(--text-secondary)">累计抓拍</td><td style="font-weight:600">${agg.totalCaptures.toLocaleString()} 张</td></tr>
    <tr><td style="color:var(--text-secondary)">AI推理完成</td><td>${agg.inferred.toLocaleString()}</td></tr>
    <tr><td style="color:var(--text-secondary)">抓拍失败</td><td style="color:var(--warning)">${agg.failed.toLocaleString()}</td></tr>
  </tbody></table>
</div>
<div>
  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">AI识别统计</div>
  <table><tbody>
    <tr><td style="color:var(--text-secondary)">AI标记隐患</td><td style="color:var(--success);font-weight:600">${agg.completedReview.toLocaleString()}</td></tr>
    <tr><td style="color:var(--text-secondary)">推理中待识别</td><td>${agg.pendingReview.toLocaleString()}</td></tr>
    <tr><td style="color:var(--text-secondary)">推理中待识别</td><td style="color:var(--warning)">${agg.pendingReview.toLocaleString()}</td></tr>
    <tr><td style="color:var(--text-secondary)">AI覆盖率</td><td style="font-weight:600">${aiAcc}%</td></tr>
  </tbody></table>
</div>
</div>
</div></div>

<div class="card" style="margin-bottom:16px"><div class="card-hd">${monthData.label} — 各轮次对比概览</div><div class="card-bd">
<table><thead><tr><th>轮次</th><th>状态</th><th>抓拍</th><th>推理</th><th>AI标记</th><th>推理待识别</th><th>AI覆盖率</th></tr></thead><tbody>
${monthData.rounds.map(r=>{
  let acc = (r.stats.completedReview+r.stats.excluded)>0?Math.round(r.stats.completedReview/(r.stats.completedReview+r.stats.excluded)*100):0;
  return `<tr>
    <td style="font-weight:500">${r.name}</td>
    <td>${roundStatusBadge(r.status)}</td>
    <td>${r.stats.totalCaptures.toLocaleString()}</td>
    <td>${r.stats.inferred.toLocaleString()}</td>
    <td style="color:var(--success);font-weight:600">${r.stats.completedReview.toLocaleString()}</td>
    <td>${r.stats.excluded.toLocaleString()}</td>
    <td>${acc}%</td>
  </tr>`;
}).join('')}
</tbody></table></div></div>

<div style="display:flex;gap:8px">
<button class="btn btn-primary" onclick="toast('月度报告PDF已生成','s')">📥 导出月度报告PDF</button>
<button class="btn btn-outline" onclick="toast('月度报告Excel已生成','s')">📊 导出月度报告Excel</button>
</div>`;
}

function renderRoundCompare() {
  return `
<div class="card"><div class="card-hd" style="justify-content:space-between"><span>轮次对比分析</span><span style="font-size:11px;color:var(--text-muted);font-weight:400">选择需要对比的轮次维度</span></div><div class="card-bd">
<p style="color:var(--text-secondary);margin-bottom:16px">对比 ${S.rounds.length} 个轮次的关键指标，追踪巡检质量趋势变化</p>
<div style="overflow-x:auto">
<table style="min-width:900px"><thead><tr><th>指标</th>${S.rounds.map(r=>`<th>${r.name}<br><span style="font-size:10px;color:var(--text-secondary);font-weight:400">${r.dateRange.start}~${r.dateRange.end}</span></th>`).join('')}<th>趋势</th></tr></thead><tbody>
<tr>
  <td style="font-weight:500">覆盖项目</td>
  ${S.rounds.map(r=>`<td style="font-weight:600">${r.stats.projectsCovered.toLocaleString()} <span style="font-size:11px;color:var(--text-secondary)">/ ${r.totalProjects.toLocaleString()}</span></td>`).join('')}
  <td style="color:var(--success)">↑ 稳定</td>
</tr>
<tr>
  <td style="font-weight:500">累计抓拍</td>
  ${S.rounds.map(r=>`<td style="font-weight:600">${r.stats.totalCaptures.toLocaleString()}</td>`).join('')}
  <td>${S.rounds.length>=2?(S.rounds[0].stats.totalCaptures>S.rounds[1].stats.totalCaptures?'<span style="color:var(--danger)">↑</span>':'<span style="color:var(--success)">↓</span>'):'—'}</td>
</tr>
<tr>
  <td style="font-weight:500">AI推理完成</td>
  ${S.rounds.map(r=>`<td>${r.stats.inferred.toLocaleString()}</td>`).join('')}
  <td>—</td>
</tr>
<tr>
  <td style="font-weight:500;color:var(--success)">AI标记隐患</td>
  ${S.rounds.map(r=>`<td style="color:var(--success);font-weight:600">${r.stats.completedReview.toLocaleString()}</td>`).join('')}
  ${S.rounds.length>=2?(()=>{
    let delta=Math.abs(Math.round((S.rounds[0].stats.completedReview-S.rounds[1].stats.completedReview)/S.rounds[1].stats.completedReview*100));
    let arrow=S.rounds[0].stats.completedReview>S.rounds[1].stats.completedReview?'↑':'↓';
    return `<td style="color:${arrow==='↑'?'var(--danger)':'var(--success)'}">${arrow} ${delta}%</td>`;
  })():'<td>—</td>'}
</tr>
<tr>
  <td style="font-weight:500">推理待识别</td>
  ${S.rounds.map(r=>`<td>${r.stats.excluded.toLocaleString()}</td>`).join('')}
  ${S.rounds.length>=2?(()=>{
    let delta=Math.abs(Math.round((S.rounds[0].stats.excluded-S.rounds[1].stats.excluded)/Math.max(S.rounds[1].stats.excluded,1)*100));
    let arrow=S.rounds[0].stats.excluded>S.rounds[1].stats.excluded?'↑':'↓';
    return `<td>${arrow} ${delta}%</td>`;
  })():'<td>—</td>'}
</tr>
<tr>
  <td style="font-weight:500">AI覆盖率</td>
  ${S.rounds.map(r=>{
    let acc=(r.stats.completedReview+r.stats.excluded)>0?Math.round(r.stats.completedReview/(r.stats.completedReview+r.stats.excluded)*100):0;
    return `<td style="font-weight:600">${acc}%</td>`;
  }).join('')}
  ${S.rounds.length>=2?(()=>{
    let a0=(S.rounds[0].stats.completedReview+S.rounds[0].stats.excluded)>0?Math.round(S.rounds[0].stats.completedReview/(S.rounds[0].stats.completedReview+S.rounds[0].stats.excluded)*100):0;
    let a1=(S.rounds[1].stats.completedReview+S.rounds[1].stats.excluded)>0?Math.round(S.rounds[1].stats.completedReview/(S.rounds[1].stats.completedReview+S.rounds[1].stats.excluded)*100):0;
    let arrow=a0>a1?'↑':'↓';
    let delta=Math.abs(a0-a1);
    return `<td style="color:${arrow==='↑'?'var(--success)':'var(--warning)'}">${arrow} ${delta}pp</td>`;
  })():'<td>—</td>'}
</tr>
<tr>
  <td style="font-weight:500">抓拍失败</td>
  ${S.rounds.map(r=>`<td style="color:var(--warning)">${r.stats.failed.toLocaleString()}</td>`).join('')}
  ${S.rounds.length>=2?(()=>{
    let arrow=S.rounds[0].stats.failed>S.rounds[1].stats.failed?'↑':'↓';
    return `<td style="color:${arrow==='↑'?'var(--danger)':'var(--success)'}">${arrow}</td>`;
  })():'<td>—</td>'}
</tr>
</tbody></table></div>

<div style="margin-top:20px">
  <div style="font-size:12px;font-weight:600;margin-bottom:12px">📊 关键发现</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    ${(()=>{
      let findings = [];
      if(S.rounds.length>=2){
        let cr=S.rounds[0], pr=S.rounds[1];
        if(cr.stats.completedReview>pr.stats.completedReview) findings.push(`<div class="stat-card" style="padding:12px"><span style="color:var(--danger);font-size:11px">⚠ 隐患上升</span><div style="font-size:12px;margin-top:4px">${cr.name}比${pr.name}AI标记隐患增加，需关注安全趋势</div></div>`);
        let a0=(cr.stats.completedReview+cr.stats.excluded)>0?Math.round(cr.stats.completedReview/(cr.stats.completedReview+cr.stats.excluded)*100):0;
        let a1=(pr.stats.completedReview+pr.stats.excluded)>0?Math.round(pr.stats.completedReview/(pr.stats.completedReview+pr.stats.excluded)*100):0;
        if(a0>a1) findings.push(`<div class="stat-card" style="padding:12px"><span style="color:var(--success);font-size:11px">✓ AI持续优化</span><div style="font-size:12px;margin-top:4px">AI覆盖率从${a1}%提升至${a0}%，模型持续优化中</div></div>`);
        if(cr.stats.failed<pr.stats.failed) findings.push(`<div class="stat-card" style="padding:12px"><span style="color:var(--success);font-size:11px">✓ 设备稳定性提升</span><div style="font-size:12px;margin-top:4px">抓拍失败数下降，摄像头运维效果显著</div></div>`);
      }
      findings.push(`<div class="stat-card" style="padding:12px"><span style="color:var(--primary-light);font-size:11px">ℹ 覆盖稳定</span><div style="font-size:12px;margin-top:4px">各轮次项目覆盖保持稳定，巡检执行率良好</div></div>`);
      return findings.join('');
    })()}
  </div>
</div>
</div></div>

<div style="display:flex;gap:8px;margin-top:16px">
<button class="btn btn-primary" onclick="toast('对比报告PDF已生成','s')">📥 导出对比报告PDF</button>
<button class="btn btn-outline" onclick="toast('对比报告Excel已生成','s')">📊 导出对比报告Excel</button>
</div>`;
}

function renderProjects() {
  let filtered = getFilteredProjects();
  let perPage = 15, page = S._projPage || 0;
  let totalPages = Math.ceil(filtered.length / perPage);
  if(page >= totalPages && totalPages > 0) page = 0;
  S._projPage = page;
  let paged = filtered.slice(page*perPage, (page+1)*perPage);
  let filterInfo = (S._projCityFilter||S._projDistrictFilter) ? '<span style="font-size:11px;color:var(--warning);margin-left:8px">筛选: '+(S._projCityFilter||'')+' '+(S._projDistrictFilter||'')+' — '+filtered.length+' 个项目</span>' : '';
  return `
<div class="card"><div class="card-hd">项目管理 <span style="font-size:11px;color:var(--text-muted);font-weight:400">共 ${S.projects.length} 个项目 / 覆盖 ${FUJIAN_CITIES.length} 市</span>${filterInfo}</div><div class="card-bd">
<div class="filters">
  ${renderCascadeFilter('proj')}
  <input placeholder="搜索项目名称..." id="projSearch" value="${S._projSearch||''}" oninput="S._projSearch=this.value;S._projPage=0;renderPage('projects')">
  <select id="projStatus" onchange="S._projStatus=this.value;S._projPage=0;renderPage('projects')">
    <option value="">全部状态</option><option value="active" ${S._projStatus==='active'?'selected':''}>在建</option><option value="suspended" ${S._projStatus==='suspended'?'selected':''}>停工</option>
  </select>
</div>
<table><thead><tr><th>编号</th><th>项目名称</th><th style="width:80px">市</th><th style="width:80px">区县</th><th>摄像头数</th><th>状态</th><th>最后巡检</th><th>操作</th></tr></thead><tbody>
${(()=>{
  let data = paged;
  let sq = (S._projSearch||'').toLowerCase();
  if(sq) data = data.filter(p=>p.name.toLowerCase().includes(sq));
  let st = S._projStatus||'';
  if(st) data = data.filter(p=>p.status===st);
  return data.map(p=>`<tr><td style="font-family:'Fira Code',monospace;font-size:11px">P-${String(p.id).padStart(4,'0')}</td><td>${p.name}</td><td style="font-size:11px;color:var(--text-secondary)">${p.city||'—'}</td><td style="font-size:11px;color:var(--text-secondary)">${p.district||'—'}</td><td>${p.cameras.length}路</td><td><span class="tag ${p.status==='active'?'tag-s':'tag-w'}">${p.status==='active'?'在建':'停工'}</span></td><td>${p.lastInspect||'—'}</td><td><button class="btn btn-sm btn-outline">详情</button> <button class="btn btn-sm btn-warning" onclick="manualInspect(${p.id})">手动巡检</button></td></tr>`).join('');
})()}
</tbody></table>

window._toggleScene = function(cid,sid,val) {
  let cam = S.cameras.find(c=>c.id===cid);
  if(!cam) return;
  if(val){ if(!cam.scenes.includes(sid)) cam.scenes.push(sid); }
  else { cam.scenes = cam.scenes.filter(s=>s!==sid); }
};
window._camSelectAll = function(cid,val) {
  let cam = S.cameras.find(c=>c.id===cid);
  if(!cam) return;
  cam.scenes = val ? SCENES.map(s=>s.id) : [];
  // Re-render modal checkboxes
  showCameraSceneModal(cid);
};

  closeModal();

function manualInspect(pid) {
  let p = S.projects.find(function(x){return x.id===pid;});
  if(!p) return;
  if(p.status==='suspended') { toast('停工项目无法触发巡检','w'); return; }
  let cams = S.cameras.filter(function(c){return c.projectId===pid;});
  let onlineCams = cams.filter(function(c){return c.status==='online';});
  let offlineCount = cams.length - onlineCams.length;

  let html = '<h3>手动巡检 — '+p.name+'</h3>';
  html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:14px">'+p.city+' '+p.district+' | 共 '+cams.length+' 路摄像头 | 最后巡检: '+(p.lastInspect||'无记录')+'</div>';

  html += '<div style="background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:12px;margin-bottom:12px;max-height:200px;overflow-y:auto">';
  html += '<div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-secondary)">待触发摄像头清单</div>';
  html += '<table><thead><tr><th>PUID</th><th>安装位置</th><th>状态</th><th>场景数</th></tr></thead><tbody>';
  cams.forEach(function(c){
    html += '<tr>';
    html += '<td style="font-family:\'Fira Code\',monospace;font-size:10px">'+c.puid+'</td>';
    html += '<td style="font-size:12px">'+c.name+'</td>';
    html += '<td><span class="tag '+(c.status==='online'?'tag-s':'tag-d')+'">'+(c.status==='online'?'在线':'离线')+'</span></td>';
    html += '<td style="font-size:11px">'+(c.scenes?c.scenes.length:0)+' 个</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  if(offlineCount>0) {
    html += '<div style="font-size:11px;color:var(--warning);margin-bottom:10px;padding:6px 10px;background:rgba(245,158,11,0.08);border-radius:var(--radius-sm)">⚠ '+offlineCount+' 路离线摄像头将被跳过，仅对 '+onlineCams.length+' 路在线设备执行抓拍</div>';
  }
  if(onlineCams.length===0) {
    html += '<div style="font-size:11px;color:var(--danger);margin-bottom:10px;padding:6px 10px;background:rgba(239,68,68,0.08);border-radius:var(--radius-sm)">该项目无在线摄像头，无法执行巡检</div>';
  }

  html += '<div id="inspectResult" style="display:none"></div>';
  html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">';
  html += '<button class="btn btn-outline" onclick="closeModal()">取消</button>';
  if(onlineCams.length>0) {
    html += '<button class="btn btn-warning" id="btnDoInspect" onclick="window._doManualInspect('+pid+')">确认触发巡检</button>';
  }
  html += '</div>';
  showModal(html);
}
window.manualInspect = manualInspect;

window._doManualInspect = function(pid) {
  var p = S.projects.find(function(x){return x.id===pid;});
  if(!p) return;
  var cams = S.cameras.filter(function(c){return c.projectId===pid;});
  var onlineCams = cams.filter(function(c){return c.status==='online';});

  var btn = document.getElementById('btnDoInspect');
  if(btn) { btn.disabled = true; btn.textContent = '巡检执行中...'; btn.className = 'btn btn-outline'; }

  setTimeout(function(){
    var captured = 0, failed = 0, hazards = 0;
    onlineCams.forEach(function(c){
      if(Math.random()>0.08) { captured++; hazards += Math.floor(Math.random()*4); }
      else { failed++; }
    });

    var now = new Date();
    p.lastInspect = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

    var resultDiv = document.getElementById('inspectResult');
    if(resultDiv) {
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:var(--radius-md);padding:14px;margin-top:12px">'+
        '<div style="font-size:15px;font-weight:700;color:var(--success);margin-bottom:10px">✓ 手动巡检执行完毕</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12px">'+
        '<div><div style="color:var(--text-muted);margin-bottom:2px">触发摄像头</div><div style="font-size:18px;font-weight:700">'+onlineCams.length+' <span style="font-size:11px;color:var(--text-secondary)">路</span></div></div>'+
        '<div><div style="color:var(--text-muted);margin-bottom:2px">成功抓拍</div><div style="font-size:18px;font-weight:700;color:var(--success)">'+captured+' <span style="font-size:11px;color:var(--text-secondary)">张</span></div></div>'+
        '<div><div style="color:var(--text-muted);margin-bottom:2px">AI标记隐患</div><div style="font-size:18px;font-weight:700;color:var(--danger)">'+hazards+' <span style="font-size:11px;color:var(--text-secondary)">处</span></div></div>'+
        '</div>'+
        (failed>0?'<div style="font-size:11px;color:var(--warning);margin-top:8px">⚠ '+failed+' 路摄像头抓拍失败，已加入重试队列</div>':'')+
        '<div style="font-size:10px;color:var(--text-muted);margin-top:8px">执行时间: '+p.lastInspect+'</div>'+
        '</div>';
    }

    if(btn) {
      btn.textContent = '已完成';
      btn.className = 'btn btn-success';
      btn.disabled = true;
    }

    toast(p.name+' 手动巡检完成: '+captured+'张抓拍, AI标记'+hazards+'处隐患','s');

    setTimeout(function(){ closeModal(); renderPage('projects'); }, 2500);
  }, 1200);
};

function saveUser(editId) {
  let username = document.getElementById('muUser')?.value.trim();
  let password = document.getElementById('muPass')?.value;
  let displayName = document.getElementById('muName')?.value.trim();
  let role = document.getElementById('muRole')?.value;
  let status = document.getElementById('muStatus')?.value;
  let projSel = document.getElementById('muProjects');
  let projectIds = [];
  if(projSel){ for(let o of projSel.options){ if(o.selected) projectIds.push(parseInt(o.value)); } }

  let err = document.getElementById('muError');
  if(!username){ err.style.display='block'; err.textContent='请输入用户名'; return; }
  if(!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(username)){ err.style.display='block'; err.textContent='用户名须以字母开头，仅含英文+数字+下划线'; return; }
  if(!editId && !password){ err.style.display='block'; err.textContent='请输入密码'; return; }
  if(password && (password.length<8||!/[a-z]/.test(password)||!/[A-Z]/.test(password)||!/[0-9]/.test(password))){ err.style.display='block'; err.textContent='密码长度≥8位，须包含大小写字母和数字'; return; }
  if(!displayName){ err.style.display='block'; err.textContent='请输入显示名'; return; }
  if(projectIds.length===0){ err.style.display='block'; err.textContent='请至少绑定1个项目'; return; }
  if(!editId && S.users.find(x=>x.username===username)){ err.style.display='block'; err.textContent='用户名已存在'; return; }

  err.style.display = 'none';
  if(editId) {
    let u = S.users.find(x=>x.id===editId);
    if(u) {
      if(password) u.password = password;
      u.displayName = displayName;
      u.role = role;
      u.projectIds = projectIds;
      u.status = status;
    }
    toast('用户信息已更新','s');
  } else {
    S.users.push({id:S.userIdCounter++, username, password:password||'', displayName, role, projectIds, status:'enabled', lastLogin:'—'});
    toast('用户创建成功','s');
  }
  closeModal();
  renderPage('users');
}

function toggleUserStatus(id) {
  let u = S.users.find(x=>x.id===id);
  if(!u) return;
  let newStatus = u.status==='enabled'?'disabled':'enabled';
  if(newStatus==='disabled'){
    showModal(`<h3>确认禁用</h3><p style="color:var(--text-secondary)">确定要禁用用户 "${u.displayName}" 吗？禁用后该用户将无法登录。</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="closeModal();S.users.find(x=>x.id===${id}).status='disabled';renderPage('users');toast('已禁用用户 ${u.displayName}','w')">确认禁用</button></div>`);
  } else {
    u.status = 'enabled';
    renderPage('users');
    toast(`已启用用户 ${u.displayName}`,'s');
  }
}

// ====== AUTH ======
// ====== AUTH ======
function doLogin() {
  let u = document.getElementById('loginUser').value;
  let role = document.getElementById('loginRole').value;
  if(!u){toast('请输入用户名','w');return;}
  S.user = role;
  document.getElementById('loginPg').style.display = 'none';
  document.getElementById('appShell').classList.add('show');
  document.getElementById('topAvatar').textContent = u[0].toUpperCase();
  document.getElementById('topName').textContent = u;
  navTo('dashboard');
  toast(`欢迎，${u} (${role==='admin'?'管理员':'查看者'})`,'s');
}

function doLogout() {
  S.user = null;
  document.getElementById('appShell').classList.remove('show');
  document.getElementById('loginPg').style.display = 'flex';
  toast('已退出登录','i');
}

// ====== GLOBAL ======
function toast(msg,type) {
  let c = document.getElementById('toastCtn');
  let t = document.createElement('div');
  t.className = 'toast toast-'+(type||'i');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{t.remove();},2200);
}

  });
