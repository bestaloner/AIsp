<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>施工填报方案三 - 工艺看板式</title>
  <style>
    :root{--blue:#1677ff;--green:#12b76a;--orange:#fa8c16;--red:#f04438;--ink:#142033;--muted:#6b7a90;--line:#e6ebf2;--bg:#f3f6fa;--shadow:0 12px 34px rgba(20,32,51,.07);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:82px 1fr;grid-template-rows:58px 1fr}.topbar{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{display:flex;align-items:center;gap:12px;color:var(--blue);font-size:20px;font-weight:900}.brand i{width:36px;height:36px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 8px;display:grid;align-content:start;gap:10px}.nav{width:66px;min-height:62px;border:0;border-radius:10px;background:transparent;color:#2f3b4a;font-weight:900}.nav.active{background:#dcecff;color:var(--blue)}main{padding:16px 18px 24px}.tabs{height:42px;border-bottom:1px solid var(--line);display:flex;gap:28px;align-items:flex-end;margin-bottom:12px}.tabs button{height:40px;border:0;background:transparent;color:#5d6b7a;font-size:16px;font-weight:900}.tabs .active{color:var(--blue);border-bottom:3px solid var(--blue)}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.select,.input{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#314257;padding:0 12px;min-width:160px}.button{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#314257;font-weight:900}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button:disabled{opacity:.45}.title{font-size:16px;font-weight:900}.sub{color:var(--muted);font-size:12px;margin-top:4px}.summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:14px;color:#607086;font-weight:800}.metric b{display:block;margin-top:8px;color:#142033;font-size:24px}.kanban{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px}.column{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.col-head{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:900}.cards{padding:12px;display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:12px;display:grid;gap:10px;cursor:pointer}.card.done{background:#f3fff8;border-color:#b7ebc8}.card.active{background:#fff8ec;border-color:#ffd591}.card.locked{opacity:.72;cursor:not-allowed}.card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #cbd5e1;background:#fff;color:#64748b;font-weight:900}.done .num{background:var(--green);border-color:var(--green);color:#fff}.active .num{background:var(--orange);border-color:var(--orange);color:#fff}.tag{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:12px;font-weight:900}.green{background:#e8fff3;color:#079455}.orange{background:#fff7e6;color:#ad6800}.gray{background:#f1f5f9;color:#64748b}.blue{background:#e6f4ff;color:#0958d9}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini div{border:1px solid #edf1f6;border-radius:6px;background:#fff;padding:8px;color:#526274;font-size:12px;font-weight:800}.mini b{display:block;margin-top:4px;color:#142033;font-size:15px}.drawer{position:fixed;right:0;top:58px;bottom:0;width:640px;background:#fff;box-shadow:-12px 0 34px rgba(20,32,51,.14);transform:translateX(100%);transition:.2s;z-index:8;overflow:auto}.drawer.show{transform:translateX(0)}.drawer-head{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:900}.drawer-body{padding:16px;display:grid;gap:12px}.note{border:1px solid #ffd591;background:#fff7e6;color:#8a5a00;border-radius:8px;padding:10px 12px;font-weight:800;line-height:1.7}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:#f7f9fc;color:#526274}.form-actions{display:flex;justify-content:flex-end;gap:10px}
    .visual-card{border:1px solid #dbe7f4;border-radius:8px;background:#f8fbff;overflow:hidden}.visual-title{height:42px;border-bottom:1px solid #dbe7f4;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:900}.visual-title small{color:#6b7a90;font-weight:800}.visual{height:270px;position:relative;overflow:hidden;background:linear-gradient(#f8fbff,#eef7ff)}.visual-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fff;border-top:1px solid #e8eef6}.visual-foot div{border:1px solid #edf1f6;border-radius:6px;background:#fbfdff;padding:8px;color:#64748b;font-size:12px;font-weight:800}.visual-foot b{display:block;margin-top:4px;color:#142033;font-size:14px}.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#dce8f5 1px,transparent 1px),linear-gradient(90deg,#dce8f5 1px,transparent 1px);background-size:24px 24px;opacity:.72}.soil{position:absolute;left:0;right:0;bottom:0;height:72%;background:linear-gradient(#c99362 0 22%,#e0b080 22% 46%,#a67543 46% 72%,#705034 72%)}.bearing{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(-30deg,#705034 0 10px,#5c412c 10px 18px);opacity:.9}.ruler{position:absolute;top:28px;bottom:22px;left:42px;width:30px;border-left:2px solid #64748b;color:#64748b;font-size:11px}.ruler span{position:absolute;left:8px}.ruler span:nth-child(1){top:0}.ruler span:nth-child(2){top:45%}.ruler span:nth-child(3){bottom:0}.pile-hole{position:absolute;left:50%;top:54px;width:104px;height:190px;transform:translateX(-50%);border:10px solid #b9d2df;border-top:0;border-radius:0 0 52px 52px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(22,119,255,.16)}.centerline{position:absolute;left:50%;top:28px;bottom:22px;border-left:2px dashed #1677ff}.cross-x,.cross-y{position:absolute;background:#1677ff}.cross-x{left:145px;right:145px;top:132px;height:2px}.cross-y{left:50%;top:68px;bottom:52px;width:2px}.ring{position:absolute;left:50%;top:132px;transform:translate(-50%,-50%);border:2px dashed #12b76a;border-radius:50%}.ring.r1{width:74px;height:74px}.ring.r2{width:122px;height:122px;border-color:#fa8c16}.ring.r3{width:170px;height:170px;border-color:#f04438}.marker{position:absolute;left:52%;top:123px;width:12px;height:12px;border-radius:50%;background:#1677ff;box-shadow:0 0 0 6px rgba(22,119,255,.16)}.casing{position:absolute;left:50%;top:44px;width:118px;height:72px;transform:translateX(-50%);border:12px solid #7e8ea3;border-bottom-width:8px;border-radius:8px;background:rgba(255,255,255,.68)}.drill{position:absolute;left:50%;top:24px;width:16px;height:176px;transform:translateX(-50%);background:#1677ff;border-radius:999px}.drill:after{content:"";position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-top:34px solid #1677ff}.mud{position:absolute;left:50%;top:94px;width:78px;height:122px;transform:translateX(-50%);background:linear-gradient(rgba(84,160,198,.25),rgba(84,160,198,.08));border-radius:0 0 36px 36px}.sediment{position:absolute;left:50%;bottom:24px;width:86px;height:20px;transform:translateX(-50%);background:#d9b27c;border-radius:0 0 28px 28px}.wave{position:absolute;height:3px;background:#1677ff;left:120px;right:120px;border-radius:999px}.wave.w1{top:82px;box-shadow:0 16px 0 #4aa3ff,0 32px 0 #82c7ff}.wave.w2{top:152px;background:#12b76a;box-shadow:0 16px 0 #65d6a2,0 32px 0 #a4ecc8}.heat{position:absolute;width:42px;height:42px;border-radius:50%;background:radial-gradient(#f04438,#fa8c16 45%,transparent 68%);opacity:.75}.heat.h1{left:334px;top:92px}.heat.h2{left:244px;top:162px;width:30px;height:30px}.check-panel{position:absolute;right:24px;top:42px;width:118px;background:#fff;border:1px solid #dbe7f4;border-radius:8px;padding:10px;box-shadow:var(--shadow);font-size:12px;color:#64748b;font-weight:800}.bar{height:7px;border-radius:99px;background:#edf2f7;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#12b76a}.cage{position:absolute;left:50%;top:54px;width:76px;height:182px;transform:translateX(-50%);border:2px solid #475569;background:repeating-linear-gradient(90deg,transparent 0 10px,#64748b 10px 12px),repeating-linear-gradient(0deg,transparent 0 18px,rgba(71,85,105,.8) 18px 20px)}.hook{position:absolute;left:50%;top:16px;width:48px;height:46px;transform:translateX(-50%);border:5px solid #1677ff;border-top:0;border-left-color:transparent;border-radius:0 0 28px 28px}.rope{position:absolute;left:50%;top:0;height:92px;border-left:3px solid #1677ff}.down-arrow{position:absolute;left:calc(50% + 70px);top:64px;width:3px;height:118px;background:#fa8c16}.down-arrow:after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid #fa8c16}.pipe{position:absolute;left:50%;top:38px;width:24px;height:188px;transform:translateX(-50%);background:#475569;border-radius:999px}.hopper{position:absolute;left:50%;top:18px;width:94px;height:54px;transform:translateX(-50%);clip-path:polygon(0 0,100% 0,68% 100%,32% 100%);background:#1677ff}.concrete{position:absolute;left:50%;bottom:24px;width:92px;height:128px;transform:translateX(-50%);background:linear-gradient(#9ca3af,#737b86);border-radius:0 0 42px 42px}.volume{position:absolute;right:32px;bottom:30px;width:82px;display:grid;gap:5px;align-items:end}.volume i{display:block;height:12px;border-radius:3px;background:#12b76a}.volume i:nth-child(1){width:54%}.volume i:nth-child(2){width:72%}.volume i:nth-child(3){width:91%}.up-arrow{position:absolute;left:calc(50% + 64px);top:62px;width:3px;height:112px;background:#1677ff}.up-arrow:after{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid #1677ff}.cap{position:absolute;left:50%;top:58px;width:122px;height:18px;transform:translateX(-50%);border-radius:9px;background:#475569}.seal{position:absolute;left:50%;top:64px;width:102px;height:180px;transform:translateX(-50%);background:linear-gradient(#aeb7c2,#737b86);border-radius:0 0 48px 48px}.stamp{position:absolute;right:32px;top:34px;width:126px;border:2px solid #12b76a;color:#079455;border-radius:8px;padding:12px;text-align:center;font-weight:900;background:#fff}.label{position:absolute;display:inline-flex;align-items:center;gap:6px;height:26px;border-radius:6px;background:#fff;border:1px solid #dbe7f4;padding:0 8px;font-size:12px;color:#526274;font-weight:900;box-shadow:0 8px 20px rgba(20,32,51,.06)}.label.a{left:26px;top:24px}.label.b{right:28px;bottom:28px}.label.c{left:26px;bottom:28px}.chip-dot{width:8px;height:8px;border-radius:50%;background:#12b76a}
    @media(max-width:1300px){.kanban{grid-template-columns:repeat(2,minmax(260px,1fr))}.toolbar{display:grid}.drawer{width:92vw}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><i>慧</i><span>慧打桩</span><button class="button">工作平台</button></div><b>施工填报方案三</b></header>
    <aside class="sidebar"><button class="nav">首页</button><button class="nav">图纸</button><button class="nav">任务</button><button class="nav active">施工</button><button class="nav">资料</button><button class="nav">设备</button></aside>
    <main>
      <div class="tabs"><button>施工实况</button><button class="active">施工填报</button><button>施工记录</button><button>工艺管理</button></div>
      <div class="toolbar"><div><div class="title">工艺填报看板</div><div class="sub">按单桩展示 16 道施工工序，点击卡片查看该工序的填报信息、质量参数与可视化结果。</div></div><div><input class="input" list="piles" value="D61 支护灌注桩"><datalist id="piles"><option value="D61 支护灌注桩"><option value="B39 支护灌注桩"><option value="C357 工程桩"></datalist><button class="button primary">刷新</button></div></div>
      <div class="summary"><div class="metric">已填报<b id="doneCount">16</b></div><div class="metric">当前状态<b id="activeName">施工完成</b></div><div class="metric">未填报<b id="waitCount">0</b></div><div class="metric">资料完整度<b>100%</b></div></div>
      <div class="kanban" id="kanban"></div>
    </main>
  </div>
  <div class="drawer" id="drawer">
    <div class="drawer-head"><span id="drawerTitle">桩点定位</span><button class="button" id="closeDrawer">关闭</button></div>
    <div class="drawer-body">
      <section class="visual-card">
        <div class="visual-title"><span id="visualTitle">工序可视化</span><small id="visualHint">偏差、标高、基准线</small></div>
        <div class="visual" id="visual"></div>
        <div class="visual-foot" id="visualFoot"></div>
      </section>
      <div class="note" id="drawerNote">该工序已填报，当前为查看状态。</div>
      <table><thead><tr><th>参数</th><th>单位</th><th>预警范围</th><th>填报值</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="form-actions"><button class="button">暂存</button><button class="button primary" id="save">保存填报</button></div>
    </div>
  </div>
  <script>
    const names=['桩点定位','钢护筒埋设','钻进成孔（土层）','钻进成孔（入持力层）','成孔检查','清孔','验收成孔（超声孔壁探测）','钢筋笼准备','下放钢筋笼','二次清孔','二次超声孔壁探测','二次清孔验收','安装导管及料斗','灌注混凝土','拔出导管及钢护筒','施工完成'];
    const groups=['定位及成孔','检测及钢筋笼','二次验收','浇筑收尾'];
    let current=16, selected=0;
    function status(i){return i<current?'done':i===current?'active':'locked'}
    function cls(i){return status(i)==='done'?'done':status(i)==='active'?'active':'locked'}
    function statusText(i){return status(i)==='done'?'已填报':status(i)==='active'?'进行中':'未填报'}
    function cardMetrics(i){
      if(i===0)return [['定位偏差','21mm'],['桩顶标高','3.82m']];
      if(i===1)return [['护筒顶标高','4.10m'],['埋设深度','1.45m']];
      if(i>=2&&i<=5)return [['孔深','23.75m'],['泥浆比重','1.12']];
      if(i===6||i===10)return [['孔壁完整','合格'],['异常点','0处']];
      if(i>=7&&i<=8)return [['笼顶标高','3.78m'],['焊接验收','合格']];
      if(i>=9&&i<=11)return [['沉渣厚度','36mm'],['垂直度','0.62%']];
      if(i===12)return [['导管埋深','2.8m'],['料斗容量','1.8m³']];
      if(i===13)return [['浇筑方量','18.34m³'],['充盈系数','1.07']];
      if(i===14)return [['拔管速度','0.8m/min'],['桩顶余灌','0.62m']];
      return [['资料归档','完成'],['质量结论','合格']];
    }
    function draw(){
      kanban.innerHTML=[0,1,2,3].map(col=>`<section class="column"><div class="col-head"><span>${groups[col]}</span><span class="tag blue">${col*4+1}-${col*4+4}</span></div><div class="cards">${names.slice(col*4,col*4+4).map((n,j)=>{const i=col*4+j;return `<article class="card ${cls(i)}" data-i="${i}"><div class="card-head"><span class="num">${i+1}</span><span class="tag ${status(i)==='done'?'green':status(i)==='active'?'orange':'gray'}">${statusText(i)}</span></div><b>${n}</b><div class="mini">${cardMetrics(i).map(m=>`<div>${m[0]}<b>${m[1]}</b></div>`).join('')}</div></article>`}).join('')}</div></section>`).join('');
      doneCount.textContent=Math.min(current,16);
      waitCount.textContent=Math.max(16-current-1,0);
      activeName.textContent=current>=16?'施工完成':names[current];
    }
    const commonHole='<div class="soil"></div><div class="bearing"></div><div class="ruler"><span>0m</span><span>12m</span><span>24m</span></div><div class="pile-hole"></div><div class="centerline"></div>';
    function visualSpec(i){
      const specs=[
        {hint:'偏差圈、设计坐标、实测坐标',html:'<div class="grid-bg"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><div class="cross-x"></div><div class="cross-y"></div><div class="marker"></div><div class="label a"><span class="chip-dot"></span>设计中心</div><div class="label b">实测偏差 21mm</div><div class="label c">控制点 A-03</div>',foot:[['设计坐标','X 3864.220 / Y 914.580'],['实测坐标','X 3864.237 / Y 914.592'],['偏差结论','允许范围内']]},
        {hint:'护筒位置、埋深、垂直度',html:'<div class="soil"></div><div class="centerline"></div><div class="casing"></div><div class="pile-hole" style="height:128px;top:92px"></div><div class="label a">护筒中心复测</div><div class="label b">埋设深度 1.45m</div><div class="label c">筒顶标高 4.10m</div>',foot:[['护筒直径','1200mm'],['中心偏差','18mm'],['埋设结论','合格']]},
        {hint:'土层剖面、钻具深度、孔径',html:commonHole+'<div class="drill"></div><div class="mud"></div><div class="label a">土层钻进</div><div class="label b">当前孔深 12.60m</div><div class="label c">泥浆护壁稳定</div>',foot:[['钻进深度','12.60m'],['泥浆比重','1.12'],['孔径控制','1000mm']]},
        {hint:'持力层进入深度、终孔控制',html:commonHole+'<div class="drill" style="height:218px"></div><div class="mud"></div><div class="label a">进入持力层 1.82m</div><div class="label b">终孔深度 23.75m</div><div class="label c">岩面标高复核</div>',foot:[['终孔深度','23.75m'],['入持力层','1.82m'],['终孔结论','满足设计']]},
        {hint:'孔深、孔径、垂直度、沉渣',html:commonHole+'<div class="sediment"></div><div class="check-panel">成孔指标<div class="bar"><i style="width:82%"></i></div>孔深合格<div class="bar"><i style="width:76%"></i></div>垂直度合格</div><div class="label a">测绳复核</div><div class="label c">沉渣 42mm</div>',foot:[['孔深','23.75m'],['垂直度','0.68%'],['沉渣厚度','42mm']]},
        {hint:'清孔循环、泥浆指标、沉渣下降',html:commonHole+'<div class="mud"></div><div class="sediment" style="height:12px"></div><div class="pipe" style="background:#1677ff"></div><div class="down-arrow"></div><div class="label a">循环清孔</div><div class="label b">沉渣降至 38mm</div><div class="label c">含砂率 2.1%</div>',foot:[['泥浆比重','1.08'],['含砂率','2.1%'],['沉渣厚度','38mm']]},
        {hint:'超声孔壁、异常热区、完整性结论',html:commonHole+'<div class="wave w1"></div><div class="wave w2"></div><div class="check-panel">孔壁探测<div class="bar"><i style="width:95%"></i></div>完整性 95%</div><div class="label a">超声孔壁探测</div><div class="label b">未见明显缩径</div>',foot:[['孔壁完整性','95%'],['缩径异常','0处'],['验收结论','通过']]},
        {hint:'钢筋笼尺寸、焊接、验收状态',html:'<div class="grid-bg"></div><div class="cage" style="height:208px;top:38px"></div><div class="check-panel">钢筋笼验收<div class="bar"><i style="width:100%"></i></div>资料齐套</div><div class="label a">主筋 20C25</div><div class="label b">笼长 22.80m</div><div class="label c">焊接合格</div>',foot:[['笼长','22.80m'],['主筋规格','20C25'],['验收结论','合格']]},
        {hint:'吊装下放、笼顶标高、保护层',html:commonHole+'<div class="rope"></div><div class="hook"></div><div class="cage"></div><div class="down-arrow"></div><div class="label a">吊装下放</div><div class="label b">笼顶标高 3.78m</div><div class="label c">保护层 70mm</div>',foot:[['笼顶标高','3.78m'],['保护层','70mm'],['下放结论','到位']]},

    function open(i){
      selected=i;
      drawerTitle.textContent=names[i];
      drawer.classList.add('show');
      const st=status(i);
      drawerNote.textContent=st==='done'?'该工序已填报，当前为查看状态；可通过可视化区域快速核对填报结果与质量结论。':st==='active'?'当前工序可填报。保存后，下一张工艺卡片进入进行中。':'该工序尚未到达，需等待前序工序完成。';
      save.disabled=st!=='active';
      const spec=visualSpec(i);
      visualTitle.textContent=names[i]+'可视化';
      visualHint.textContent=spec.hint;
      visual.innerHTML=spec.html;
      visualFoot.innerHTML=spec.foot.map(item=>`<div>${item[0]}<b>${item[1]}</b></div>`).join('');
      rows.innerHTML=fieldRows(i).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><input class="input" value="${r[3]}" ${st==='done'?'readonly':''}></td></tr>`).join('');
    }
    document.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;open(Number(c.dataset.i))});
    closeDrawer.onclick=()=>drawer.classList.remove('show');
    save.onclick=()=>{if(selected!==current)return;current=Math.min(current+1,16);selected=Math.min(current,15);draw();open(selected)};
    draw();
    open(0);
  </script>
